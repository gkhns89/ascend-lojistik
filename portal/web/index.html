<!doctype html>
<html lang="tr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Ascend Portal</title>
    <script>
      // Temayi ilk boyamadan once uygula ki acilista yanip sonme olmasin.
      try {
        var stored = localStorage.getItem("ascend-portal-theme");
        var system = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = stored === "dark" || stored === "light" ? stored : system;
      } catch (_) {
        /* private mode: varsayilan light kalir */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
